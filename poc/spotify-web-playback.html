<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicLoom – Spotify Web Playback PoC</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 680px; margin: 5vh auto; padding: 0 24px; }
    h1 { font-size: 1.35rem; }
    p { line-height: 1.6; color: #888; }
    label { display: block; margin: 1rem 0 .4rem; }
    input { width: 100%; box-sizing: border-box; padding: .8rem; background: transparent; border: 1px solid #8886; border-radius: .5rem; color: inherit; }
    button { cursor: pointer; background: transparent; color: inherit; border: 1px solid #8886; border-radius: .5rem; padding: .7rem 1rem; margin: .75rem .4rem .5rem 0; }
    button:disabled { cursor: default; opacity: .4; }
    #status { font: .85rem ui-monospace, monospace; white-space: pre-wrap; }
  </style>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
</head>
<body>
  <h1>Spotify — authorized Web Playback PoC</h1>
  <p>Uses the official Spotify Web Playback SDK and your own Premium OAuth token. No audio file is extracted. This page never saves the token to localStorage, a cookie, or a file. The Spotify SDK handles streaming and DRM.</p>
  <label for="token">OAuth access token (Premium account, streaming + playback scopes)</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false">
  <label for="track">Spotify track ID (22 letters/digits)</label>
  <input id="track" autocomplete="off" placeholder="4iV5W9uYEdYUVa79Axb7Rh">
  <div>
    <button id="connect" disabled>Connect player</button>
    <button id="play" disabled>Play selected track</button>
    <button id="pause" disabled>Pause</button>
    <button id="disconnect" disabled>Disconnect</button>
  </div>
  <p id="status" role="status" aria-live="polite">Loading Spotify Web Playback SDK…</p>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const status = message => { $('status').textContent = message; };
    let sdkReady = false;
    let player = null;
    let deviceId = null;

    window.onSpotifyWebPlaybackSDKReady = () => {
      sdkReady = true;
      $('connect').disabled = false;
      status('SDK ready. Enter your personal, properly scoped Premium OAuth token.');
    };

    $('connect').addEventListener('click', async () => {
      if (!sdkReady || !$('token').value.trim()) {
        status('A user-supplied OAuth token and loaded SDK are required.');
        return;
      }
      if (player) player.disconnect();
      deviceId = null;
      player = new Spotify.Player({
        name: 'MusicLoom Spotify Provider Research',
        getOAuthToken: cb => cb($('token').value.trim()),
        volume: 0.7
      });
      player.addListener('ready', payload => {
        deviceId = payload.device_id;
        $('play').disabled = false;
        $('pause').disabled = false;
        $('disconnect').disabled = false;
        status('Spotify device ready. Play only if you want to start audio on it.');
      });
      player.addListener('not_ready', () => {
        deviceId = null;
        $('play').disabled = true;
        status('Spotify device is not ready.');
      });
      for (const event of ['initialization_error', 'authentication_error', 'account_error', 'playback_error']) {
        player.addListener(event, () => status(event + '. Check your Premium account, browser, OAuth scopes, and playback entitlement.'));
      }
      try {
        const connected = await player.connect();
        if (!connected) status('SDK could not connect a playback device.');
      } catch {
        status('Could not initialize Spotify protected playback.');
      }
    });

    $('play').addEventListener('click', async () => {
      const id = $('track').value.trim();
      if (!deviceId || !/^[A-Za-z0-9]{22}$/.test(id)) {
        status('Connect a device and enter a 22-character Spotify track ID.');
        return;
      }
      try {
        const response = await fetch(
          'https://api.spotify.com/v1/me/player/play?device_id=' + encodeURIComponent(deviceId), {
            method: 'PUT',
            headers: {
              Authorization: 'Bearer ' + $('token').value.trim(),
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ uris: ['spotify:track:' + id] })
          });
        if (!response.ok) {
          status('Spotify playback request denied: HTTP ' + response.status +
            '. Verify user-modify-playback-state permission and active Premium subscription.');
          return;
        }
        status('Spotify accepted the playback command for ' + id +
          '. Confirm audible output; an HTTP 204 alone does not prove audio playback.');
      } catch {
        status('Spotify Connect playback request failed.');
      }
    });
    $('pause').addEventListener('click', async () => {
      try { if (player) await player.pause(); status('Pause requested.'); }
      catch { status('Pause failed.'); }
    });
    $('disconnect').addEventListener('click', () => {
      if (player) player.disconnect();
      player = null;
      deviceId = null;
      $('play').disabled = true;
      $('pause').disabled = true;
      $('disconnect').disabled = true;
      status('Spotify player disconnected.');
    });
  </script>
</body>
</html>
