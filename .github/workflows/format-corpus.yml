name: Lyrics Format Corpus

on:
  pull_request:
    paths:
      - "src/MusicLoom.Tagging/**"
      - "src/MusicLoom.Core/Lyrics/**"
      - "tests/MusicLoom.FormatCorpus/**"
      - ".github/workflows/format-corpus.yml"
  workflow_dispatch:

concurrency:
  group: musicloom-format-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Corpus / home-docker NativeAOT
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout MusicLoom
        uses: actions/checkout@v7

      - name: Checkout pinned TagLib# samples
        uses: actions/checkout@v7
        with:
          repository: mono/taglib-sharp
          ref: da41dc30756189217624d8fdde3c70956e7341f9
          path: .fixtures/taglib-sharp
          sparse-checkout: tests/TaglibSharp.Tests/samples

      - name: Use runner-local .NET directories
        shell: bash
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_HOME=$RUNNER_TEMP/dotnet-home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run managed format corpus
        run: dotnet run --project tests/MusicLoom.FormatCorpus/MusicLoom.FormatCorpus.csproj -c Release -- .fixtures/taglib-sharp/tests/TaglibSharp.Tests/samples

      - name: Publish format corpus with NativeAOT
        run: dotnet publish tests/MusicLoom.FormatCorpus/MusicLoom.FormatCorpus.csproj -c Release -r linux-x64 --self-contained true -o artifacts/format-corpus

      - name: Run NativeAOT format corpus
        run: ./artifacts/format-corpus/MusicLoom.FormatCorpus .fixtures/taglib-sharp/tests/TaglibSharp.Tests/samples

  windows:
    name: Corpus / Windows NativeAOT
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout MusicLoom
        uses: actions/checkout@v7

      - name: Checkout pinned TagLib# samples
        uses: actions/checkout@v7
        with:
          repository: mono/taglib-sharp
          ref: da41dc30756189217624d8fdde3c70956e7341f9
          path: .fixtures/taglib-sharp
          sparse-checkout: tests/TaglibSharp.Tests/samples

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run managed format corpus
        run: dotnet run --project tests/MusicLoom.FormatCorpus/MusicLoom.FormatCorpus.csproj -c Release -- .fixtures/taglib-sharp/tests/TaglibSharp.Tests/samples

      - name: Publish format corpus with NativeAOT
        run: dotnet publish tests/MusicLoom.FormatCorpus/MusicLoom.FormatCorpus.csproj -c Release -r win-x64 --self-contained true -o artifacts/format-corpus

      - name: Run NativeAOT format corpus
        run: .\artifacts\format-corpus\MusicLoom.FormatCorpus.exe .fixtures\taglib-sharp\tests\TaglibSharp.Tests\samples
