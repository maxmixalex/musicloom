name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: musicloom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / NativeAOT
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use runner-local .NET directories
        shell: bash
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_HOME=$RUNNER_TEMP/dotnet-home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore core tests
        run: dotnet restore tests/MusicLoom.Tests/MusicLoom.Tests.csproj

      - name: Build core tests
        run: dotnet build tests/MusicLoom.Tests/MusicLoom.Tests.csproj -c Release --no-restore

      - name: Run regression harness
        run: dotnet run --project tests/MusicLoom.Tests/MusicLoom.Tests.csproj -c Release --no-build

      - name: Publish regression harness with NativeAOT
        run: dotnet publish tests/MusicLoom.Tests/MusicLoom.Tests.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -o artifacts/regression-linux-x64

      - name: Run NativeAOT regression harness
        run: ./artifacts/regression-linux-x64/MusicLoom.Tests

      - name: Publish CLI with NativeAOT
        run: dotnet publish src/MusicLoom.Cli/MusicLoom.Cli.csproj -c Release -r linux-x64 --self-contained true -o artifacts/cli-linux-x64

      - name: Upload Linux CLI
        uses: actions/upload-artifact@v6
        with:
          name: musicloom-cli-linux-x64
          path: artifacts/cli-linux-x64/**
          if-no-files-found: error
