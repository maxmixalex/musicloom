name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: musicloom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / NativeAOT
    runs-on: home-docker
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore core tests
        run: dotnet restore tests/MusicLoom.Tests/MusicLoom.Tests.csproj

      - name: Build core tests
        run: dotnet build tests/MusicLoom.Tests/MusicLoom.Tests.csproj -c Release --no-restore

      - name: Run regression harness
        run: dotnet run --project tests/MusicLoom.Tests/MusicLoom.Tests.csproj -c Release --no-build

      - name: Publish CLI with NativeAOT
        run: dotnet publish src/MusicLoom.Cli/MusicLoom.Cli.csproj -c Release -r linux-x64 --self-contained true -o artifacts/cli-linux-x64

      - name: Upload Linux CLI
        uses: actions/upload-artifact@v6
        with:
          name: musicloom-cli-linux-x64
          path: artifacts/cli-linux-x64/**
          if-no-files-found: error
