name: Windows UI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: musicloom-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winui:
    name: Regression / WinUI 3 / NativeAOT
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore regression harness
        run: dotnet restore tests/MusicLoom.Tests/MusicLoom.Tests.csproj

      - name: Build regression harness
        run: dotnet build tests/MusicLoom.Tests/MusicLoom.Tests.csproj -c Release --no-restore

      - name: Run regression harness
        run: dotnet run --project tests/MusicLoom.Tests/MusicLoom.Tests.csproj -c Release --no-build

      - name: Publish CLI with NativeAOT
        run: dotnet publish src/MusicLoom.Cli/MusicLoom.Cli.csproj -c Release -r win-x64 --self-contained true -o artifacts/cli-win-x64

      - name: Run TagLibSharp streaming probe
        run: dotnet run --project experiments/MusicLoom.TagLibSharpAotProbe/MusicLoom.TagLibSharpAotProbe.csproj -c Release

      - name: Publish TagLibSharp probe with NativeAOT
        run: dotnet publish experiments/MusicLoom.TagLibSharpAotProbe/MusicLoom.TagLibSharpAotProbe.csproj -c Release -r win-x64 --self-contained true -o artifacts/taglibsharp-probe

      - name: Run NativeAOT TagLibSharp probe
        run: .\\artifacts\\taglibsharp-probe\\MusicLoom.TagLibSharpAotProbe.exe

      - name: Run Windows audio decoder smoke test
        run: dotnet run --project tests/MusicLoom.Windows.Tests/MusicLoom.Windows.Tests.csproj -c Release

      - name: Publish Windows audio smoke test with NativeAOT
        run: dotnet publish tests/MusicLoom.Windows.Tests/MusicLoom.Windows.Tests.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows-audio-smoke

      - name: Run NativeAOT Windows audio smoke test
        run: .\artifacts\windows-audio-smoke\MusicLoom.Windows.Tests.exe

      - name: Restore WinUI
        run: dotnet restore src/MusicLoom.App/MusicLoom.App.csproj -r win-x64

      - name: Build WinUI shell
        run: dotnet build src/MusicLoom.App/MusicLoom.App.csproj -c Release -r win-x64 -p:Platform=x64 --no-restore

      - name: Publish NativeAOT app
        run: dotnet publish src/MusicLoom.App/MusicLoom.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true --no-restore -o artifacts/app-win-x64

      - name: Upload Windows CLI
        uses: actions/upload-artifact@v6
        with:
          name: musicloom-cli-win-x64
          path: artifacts/cli-win-x64/**
          if-no-files-found: error

      - name: Upload Windows app
        uses: actions/upload-artifact@v6
        with:
          name: musicloom-app-win-x64
          path: artifacts/app-win-x64/**
          if-no-files-found: error
