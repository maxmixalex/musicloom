name: Windows UI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: musicloom-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winui:
    name: Regression / WinUI 3 / NativeAOT core
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Settings right rail
        shell: pwsh
        run: |
          $xaml = Get-Content "src/MusicLoom.App/MainWindow.xaml" -Raw

          $stretchControls = @(
            "LyricsStorageModeBox",
            "LyricsRefreshHoursBox",
            "ThemeBox",
            "LongTextModeBox",
            "LanguageBox",
            "AccentControlRail"
          )

          foreach ($name in $stretchControls) {
            $pattern =
              'x:Name="' + [regex]::Escape($name) +
              '"(?:(?!>).)*HorizontalAlignment="Stretch"'
            if (-not [regex]::IsMatch($xaml, $pattern, [System.Text.RegularExpressions.RegexOptions]::Singleline)) {
              throw "Settings control '$name' must stretch inside the shared 280px rail."
            }
          }

          $railCount =
            ([regex]::Matches(
              $xaml,
              '<ColumnDefinition Width="280" />'
            )).Count
          if ($railCount -lt 9) {
            throw "Settings page no longer provides the expected 280px right-side control rails."
          }

          $toggleControls = @(
            "AutoScanOnStartupToggle",
            "LyricsOverrideToggle",
            "AcrylicToggle"
          )

          foreach ($name in $toggleControls) {
            $pattern =
              '<Grid\s+Grid.Column="1"\s+Width="280"\s+HorizontalAlignment="Right">\s*' +
              '<ToggleSwitch\s+x:Name="' + [regex]::Escape($name) + '"'
            if (-not [regex]::IsMatch($xaml, $pattern, [System.Text.RegularExpressions.RegexOptions]::Singleline)) {
              throw "Settings toggle '$name' is not hosted on the 280px right-aligned rail."
            }
          }

          $pathRows = @(
            "SourcePathBox",
            "DestinationPathBox",
            "PlaylistSourcePathBox"
          )

          foreach ($name in $pathRows) {
            $pattern =
              '<Grid.ColumnDefinitions><ColumnDefinition Width="190" /><ColumnDefinition Width="\*" /><ColumnDefinition Width="Auto" /><ColumnDefinition Width="Auto" /></Grid.ColumnDefinitions>' +
              '(?:(?!</Grid>).)*x:Name="' + [regex]::Escape($name) + '"'
            if (-not [regex]::IsMatch($xaml, $pattern, [System.Text.RegularExpressions.RegexOptions]::Singleline)) {
              throw "Library path '$name' no longer uses the shared path-row geometry."
            }
          }

          if ($xaml -notmatch 'x:Name="PlaylistBaseBox"[^>]*Grid.Column="1"[^>]*Grid.ColumnSpan="3"[^>]*HorizontalAlignment="Stretch"') {
            throw "PlaylistBaseBox must span the same remaining width as path input plus action columns."
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore regression harness
        run: dotnet restore tests/MusicLoom.Tests/MusicLoom.Tests.csproj

      - name: Build regression harness
        run: dotnet build tests/MusicLoom.Tests/MusicLoom.Tests.csproj -c Release --no-restore

      - name: Run regression harness
        run: dotnet run --project tests/MusicLoom.Tests/MusicLoom.Tests.csproj -c Release --no-build

      - name: Publish regression harness with NativeAOT
        run: dotnet publish tests/MusicLoom.Tests/MusicLoom.Tests.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -o artifacts/regression-win-x64

      - name: Run NativeAOT regression harness
        run: .\artifacts\regression-win-x64\MusicLoom.Tests.exe

      - name: Run independent provider PoC fixtures (Windows)
        run: dotnet run --project tests/MusicLoom.ProviderPoc.Tests/MusicLoom.ProviderPoc.Tests.csproj -c Release

      - name: Build standalone provider experiment CLI (Windows)
        run: dotnet build src/MusicLoom.ProviderPoc.Cli/MusicLoom.ProviderPoc.Cli.csproj -c Release

      - name: Publish isolated provider PoC CLI (Windows NativeAOT)
        run: dotnet publish src/MusicLoom.ProviderPoc.Cli/MusicLoom.ProviderPoc.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -o artifacts/provider-poc-cli-win-x64

      - name: Upload isolated provider CLI (Windows)
        uses: actions/upload-artifact@v6
        with:
          name: musicloom-provider-poc-win-x64
          path: artifacts/provider-poc-cli-win-x64/**
          if-no-files-found: error

      - name: Publish CLI with NativeAOT
        run: dotnet publish src/MusicLoom.Cli/MusicLoom.Cli.csproj -c Release -r win-x64 --self-contained true -o artifacts/cli-win-x64

      - name: Run Windows audio decoder smoke test
        run: dotnet run --project tests/MusicLoom.Windows.Tests/MusicLoom.Windows.Tests.csproj -c Release

      - name: Publish Windows audio smoke test with NativeAOT
        run: dotnet publish tests/MusicLoom.Windows.Tests/MusicLoom.Windows.Tests.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows-audio-smoke

      - name: Run NativeAOT Windows audio smoke test
        run: .\artifacts\windows-audio-smoke\MusicLoom.Windows.Tests.exe

      - name: Restore WinUI
        run: dotnet restore src/MusicLoom.App/MusicLoom.App.csproj -r win-x64

      - name: Build WinUI shell
        run: dotnet build src/MusicLoom.App/MusicLoom.App.csproj -c Release -r win-x64 -p:Platform=x64 --no-restore

      - name: Publish self-contained WinUI app
        run: dotnet publish src/MusicLoom.App/MusicLoom.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true --no-restore -o artifacts/app-win-x64

      - name: Assemble clean Windows release
        shell: pwsh
        run: |
          Get-ChildItem "artifacts/app-win-x64" -Filter *.pdb -Recurse -File |
            Remove-Item -Force

          Copy-Item LICENSE artifacts/app-win-x64/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/app-win-x64/THIRD_PARTY_NOTICES.md

          $required = @(
            "MusicLoom.exe",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md"
          )
          foreach ($name in $required) {
            $path = Join-Path "artifacts/app-win-x64" $name
            if (-not (Test-Path $path)) {
              throw "Missing release file: $path"
            }
          }

          $forbidden = Get-ChildItem "artifacts/app-win-x64" -Recurse -File |
            Where-Object {
              $_.Name -ieq "createdump.exe" -or
              $_.Name -ieq "RestartAgent.exe" -or
              $_.Extension -ieq ".dll" -or
              $_.Extension -ieq ".pdb"
            }
          if ($forbidden) {
            $forbidden | Select-Object FullName | Format-Table -AutoSize
            throw "Clean single-file release still exposes runtime/debug binaries."
          }

          $unexpectedDirectories =
            Get-ChildItem "artifacts/app-win-x64" -Directory
          if ($unexpectedDirectories) {
            $unexpectedDirectories | Select-Object FullName | Format-Table -AutoSize
            throw "Clean single-file release unexpectedly contains subdirectories."
          }

          $exePath = (Resolve-Path "artifacts/app-win-x64/MusicLoom.exe").Path
          Add-Type -AssemblyName System.Drawing.Common -ErrorAction SilentlyContinue
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exePath)
          if ($null -eq $icon -or $icon.Width -le 0 -or $icon.Height -le 0) {
            throw "Published MusicLoom.exe does not expose an application icon."
          }
          Write-Host "Embedded EXE icon: $($icon.Width)x$($icon.Height)"

          $bitmap = $icon.ToBitmap()
          $sampleX = [Math]::Min($bitmap.Width - 1, [Math]::Floor($bitmap.Width * 0.75))
          $sampleY = [Math]::Min($bitmap.Height - 1, [Math]::Floor($bitmap.Height * 0.25))
          $sample = $bitmap.GetPixel($sampleX, $sampleY)
          Write-Host "MusicLoom icon sample: R=$($sample.R) G=$($sample.G) B=$($sample.B)"
          if ($sample.B -lt 120 -or $sample.B -lt ($sample.R + 35)) {
            throw "Published MusicLoom.exe appears to expose a generic/unexpected icon instead of the MusicLoom blue mark."
          }
          $bitmap.Dispose()
          $icon.Dispose()

          Get-ChildItem "artifacts/app-win-x64" |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Launch WinUI build and publish outputs
        shell: pwsh
        run: |
          function Test-MusicLoomLaunch {
            param(
              [Parameter(Mandatory = $true)][string]$Exe,
              [Parameter(Mandatory = $true)][string]$Label
            )

            $safeLabel = $Label -replace '[^A-Za-z0-9_.-]', '-'
            $marker = Join-Path $PWD "artifacts/$safeLabel.launch-ok"
            $waveMarker = Join-Path $PWD "artifacts/$safeLabel.waveform-ok"
            $karaokeMarker = Join-Path $PWD "artifacts/$safeLabel.karaoke-ok"
            $matchMarker = Join-Path $PWD "artifacts/$safeLabel.match-ui.ok"
            $matchError = "$matchMarker.failed"
            $trace = Join-Path $PWD "artifacts/$safeLabel.startup.log"
            $karaokeError = "$karaokeMarker.failed"
            Remove-Item $marker, $waveMarker, $karaokeMarker, $karaokeError, $matchMarker, $matchError, $trace -Force -ErrorAction SilentlyContinue

            $env:MUSICLOOM_SMOKE_MARKER = $marker
            $env:MUSICLOOM_WAVEFORM_SMOKE_MARKER = $waveMarker
            $env:MUSICLOOM_KARAOKE_SMOKE_MARKER = $karaokeMarker
            $env:MUSICLOOM_MATCH_SMOKE_MARKER = $matchMarker
            $env:MUSICLOOM_STARTUP_TRACE = $trace
            $startedAt = Get-Date
            $process = Start-Process -FilePath $Exe -PassThru
            $failure = $null

            try {
              $deadline = (Get-Date).AddSeconds(30)
              while ((Get-Date) -lt $deadline -and
                      (-not (Test-Path $marker) -or
                       -not (Test-Path $waveMarker) -or
                       -not (Test-Path $karaokeMarker) -or
                       -not (Test-Path $matchMarker)) -and
                      -not (Test-Path $karaokeError) -and
                      -not (Test-Path $matchError)) {
                if ($process.HasExited) {
                  $failure = "$Label exited before its main window activated. Exit code: $($process.ExitCode)"
                  break
                }
                Start-Sleep -Milliseconds 250
              }

              if (-not $failure -and -not (Test-Path $marker)) {
                $failure = "$Label did not activate its main window within 30 seconds."
              }
              if (-not $failure -and -not (Test-Path $waveMarker)) {
                $failure = "$Label failed its native waveform render/resize smoke test."
              }
              if (-not $failure -and (Test-Path $karaokeError)) {
                $failure = "$Label karaoke smoke: $(Get-Content $karaokeError -Raw)"
              }
              if (-not $failure -and -not (Test-Path $karaokeMarker)) {
                $failure = "$Label failed karaoke render/seek smoke test."
              }
              if (-not $failure -and (Test-Path $matchError)) {
                $failure = "$Label matching behavior smoke: $(Get-Content $matchError -Raw)"
              }
              if (-not $failure -and -not (Test-Path $matchMarker)) {
                $failure = "$Label failed the matching UI behavior regression."
              }
              if (-not $failure) {
                foreach ($provider in @("Netease", "QqMusic", "KugouMusic", "SearchDialog", "ImmersiveViewport", "RubyViewport")) {
                  $picture = "$matchMarker.$provider.png"
                  # The ruby test separately asserts actual bright glyph pixels;
                  # repeated characters compress exceptionally well in PNG.
                  $minBytes = if ($provider -eq "RubyViewport") { 500 } else { 1800 }
                  if (-not (Test-Path $picture) -or (Get-Item $picture).Length -lt $minBytes) {
                    $failure = "$Label failed to render $provider matching panel PNG."
                    break
                  }
                }
              }

              if (Test-Path $trace) {
                Write-Host "=== $Label startup trace ==="
                Get-Content $trace | ForEach-Object { Write-Host $_ }
              } else {
                Write-Host "=== $Label startup trace: no trace file ==="
              }

              if ($failure) {
                $diagnostic = Join-Path $env:LOCALAPPDATA "MusicLoom/logs/musicloom.log"
                if (Test-Path $diagnostic) {
                  Write-Host "=== Recent MusicLoom diagnostics ==="
                  Get-Content $diagnostic -Tail 80 | ForEach-Object { Write-Host $_ }
                }
                Write-Host "=== Windows Application events since launch ==="
                Get-WinEvent -FilterHashtable @{
                  LogName = 'Application'
                  StartTime = $startedAt.AddSeconds(-2)
                } -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.Message -match 'MusicLoom|Microsoft\.UI\.Xaml|0xc000027b|C000027B'
                  } |
                  Select-Object TimeCreated, Id, ProviderName, LevelDisplayName, Message |
                  Format-List |
                  Out-String -Width 4096 |
                  Write-Host

                Write-Host "FAIL: $failure"
                return $false
              }

              Write-Host "=== $Label activated; waveform, karaoke and matching UI verified ==="
              Get-Content $marker | ForEach-Object { Write-Host $_ }
              Get-Content $waveMarker | ForEach-Object { Write-Host $_ }
              Get-Content $karaokeMarker | ForEach-Object { Write-Host $_ }
              Get-Content $matchMarker | ForEach-Object { Write-Host $_ }
              return $true
            }
            finally {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
              Remove-Item Env:MUSICLOOM_SMOKE_MARKER -ErrorAction SilentlyContinue
              Remove-Item Env:MUSICLOOM_WAVEFORM_SMOKE_MARKER -ErrorAction SilentlyContinue
              Remove-Item Env:MUSICLOOM_KARAOKE_SMOKE_MARKER -ErrorAction SilentlyContinue
              Remove-Item Env:MUSICLOOM_MATCH_SMOKE_MARKER -ErrorAction SilentlyContinue
              Remove-Item Env:MUSICLOOM_STARTUP_TRACE -ErrorAction SilentlyContinue
            }
          }

          $buildExe = Join-Path $PWD "src/MusicLoom.App/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/MusicLoom.exe"
          $publishExe = Join-Path $PWD "artifacts/app-win-x64/MusicLoom.exe"

          $buildOk = Test-MusicLoomLaunch -Exe $buildExe -Label "build-output"
          $publishOk = Test-MusicLoomLaunch -Exe $publishExe -Label "publish-output"

          if (-not $buildOk -or -not $publishOk) {
            throw "WinUI launch smoke test failed."
          }

          $runtimeIcon = Join-Path $env:LOCALAPPDATA "MusicLoom\MusicLoom.ico"
          if (-not (Test-Path $runtimeIcon)) {
            throw "MusicLoom did not materialize its AppWindow icon at runtime."
          }
          $runtimeIconInfo = Get-Item $runtimeIcon
          if ($runtimeIconInfo.Length -lt 1024) {
            throw "Runtime AppWindow icon is unexpectedly small or invalid."
          }
          Write-Host "Runtime AppWindow icon materialized: $($runtimeIconInfo.FullName) ($($runtimeIconInfo.Length) bytes)"

      - name: Upload matching behavior and screenshot proof
        # Retain screenshots even when a visual assertion fails. They are
        # diagnostic evidence, NOT acceptance on failed workflows.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: musicloom-match-ui-evidence
          path: |
            artifacts/*.match-ui.ok
            artifacts/*.match-ui.ok.*.png
            artifacts/*.match-ui.ok.failed
          if-no-files-found: warn

      - name: Upload Windows CLI
        uses: actions/upload-artifact@v6
        with:
          name: musicloom-cli-win-x64
          path: artifacts/cli-win-x64/**
          if-no-files-found: error

      - name: Upload Windows app
        uses: actions/upload-artifact@v6
        with:
          name: musicloom-win-x64
          path: artifacts/app-win-x64/**
          if-no-files-found: error
